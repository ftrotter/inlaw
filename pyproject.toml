[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inlaw"
version = "0.2.0"
description = "A lightweight wrapper around Great Expectations for database validation testing"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "CC0-1.0"
license-files = ["LICENSE"]
authors = [
    {name = "Fred Trotter", email = "ftrotter@gmail.com"}
]
keywords = ["testing", "database", "validation", "great-expectations", "data-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "great-expectations>=1.0.0,<2.0.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "dynaconf>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
duckdb = [
    "duckdb-engine>=0.9.0",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]
mysql = [
    "pymysql>=1.0.0",
]

[project.scripts]
inlaw = "inlaw.cli:main"

[project.urls]
Homepage = "https://github.com/ftrotter/inlaw"
Repository = "https://github.com/ftrotter/inlaw"
Issues = "https://github.com/ftrotter/inlaw/issues"

[tool.setuptools.packages.find]
where = ["src"]
